# Push a tag matching herdr-plugin.toml's version (e.g. v0.1.0) to publish
# binaries + SHA256SUMS that scripts/build.sh downloads.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # Intel macOS runners are retired; cross-compile on arm64.
          - { os: macos-14, target: x86_64-apple-darwin }
          # Oldest available runner keeps the glibc requirement low.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-agent-prs herdr-agent-prs-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-agent-prs-${{ matrix.target }}
          path: herdr-agent-prs-${{ matrix.target }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum herdr-agent-prs-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
